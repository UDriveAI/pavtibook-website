name: pavtibook_app
description: "Traditional Indian digital receipt platform client for Android, iOS, and Web."
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  url_launcher: ^6.2.5
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.7
  pdf: ^3.10.8
  image_picker: ^1.0.7
  razorpay_flutter: ^1.4.5
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    # Optional assets directory for god icons or decorative borders
    - assets/images/
    - assets/fonts/
    - lib/l10n/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Pavati-Book-LogoIcon-Solid.png"
  adaptive_icon_background: "#FFF6E8"
  adaptive_icon_foreground: "assets/images/Pavati-Book-LogoIcon-Padded.png"
